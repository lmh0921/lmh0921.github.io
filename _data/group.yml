tagline: Search, memory & reasoning for language AI.
description: SUGAR is an NLP research group within the NLP Lab at the School of Computer Science and Technology, Soochow University. We study how language models retrieve evidence, retain useful knowledge, and reason over it, with applications in conversational search and legal AI.
areas:
  - title: Search & RAG
    description: Conversational search, long-document retrieval, query expansion, and evidence-aware reranking.
  - title: Agent memory & reasoning
    description: Long-term conversational memory, causality-enhanced memory mechanisms, and efficient LLM reasoning.
  - title: Legal AI
    description: Legal case retrieval, legal inference, and evidence ranking for knowledge-intensive tasks.
